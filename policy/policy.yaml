# Warden egress policy. Deny by default. First matching rule wins.
version: 1
default: deny
rules:
  - id: pypi-read
    host: pypi.org
    ports: [443]
    methods: [GET, HEAD]
    paths: ["/simple/", "/pypi/"]
  - id: pypi-files
    host: files.pythonhosted.org
    ports: [443]
    methods: [GET, HEAD]
  - id: github-raw-read
    host: raw.githubusercontent.com
    ports: [443]
    methods: [GET, HEAD]
  - id: github-api-read
    host: api.github.com
    ports: [443]
    methods: [GET]
    paths: ["/repos/"]
  - id: docs
    host: docs.python.org
    ports: [443]
    methods: [GET, HEAD]
